<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiiruzu - Static Badges Maker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.9/daisyui.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-900 text-white">
    <div class="flex flex-col md:flex-row w-full max-w-4xl gap-4">
        <div class="md:w-1/2 bg-gray-800 shadow-md rounded-lg p-4 flex flex-col items-center sticky top-4 border-2 border-transparent">
            <h1 class="text-xl font-semibold text-center mb-3 bg-gradient-to-r from-red-400 via-orange-400 to-yellow-400 bg-clip-text text-transparent">Preview</h1>
            <div class="w-full h-full p-12 border-4 border-transparent shadow-lg">
              <img id="badgePreview" class="mx-auto my-2 w-full h-full object-contain" />
            </div>
        </div>
        <div class="md:w-1/2 bg-gray-800 shadow-md rounded-lg p-4">
            <h1 class="text-xl font-semibold text-center mb-3 bg-gradient-to-r from-green-400 via-blue-400 to-purple-400 bg-clip-text text-transparent">Badge Generator</h1>
            <form id="badgeForm" class="space-y-3">
                <div class="flex gap-2">
                    <label class="w-2/3">Right Side (Message) * <input type="text" id="message" placeholder="Required" class="input input-bordered w-full bg-gray-700 text-white border-2 border-transparent mt-2" required autocomplete="off" /></label>
                    <label class="w-1/3"> <span class="invisible">.</span> <input type="color" id="color" class="w-full h-10 border-2 border-transparent mt-2" autocomplete="off" /></label>
                </div>
                <div class="flex gap-2">
                    <label class="w-2/3">Left Side (Label)<input type="text" id="label" placeholder="Optional" class="input input-bordered w-full bg-gray-700 text-white border-2 border-transparent mt-2" autocomplete="off" /></label>
                    <label class="w-1/3"> <span class="invisible">.</span> <input type="color" id="labelColor" class="w-full h-10 border-2 border-transparent" autocomplete="off" /></label>
                </div>
                <label class="block">Style
                    <select id="style" class="select select-bordered w-full bg-gray-700 text-white border-2 border-transparent mt-2" autocomplete="off">
                        <option value="plastic">Plastic</option>
                        <option value="flat">Flat</option>
                        <option value="flat-square">Flat Square</option>
                        <option value="for-the-badge">For the Badge</option>
                        <option value="social">Social</option>
                    </select>
                </label>
                <label class="block">Image URL <input type="url" id="img" placeholder="Optional" class="input input-bordered w-full bg-gray-700 text-white border-2 border-transparent mt-2" autocomplete="off" /></label>
                <label class="block">Links (comma-separated) <input type="text" id="url" placeholder="Optional" class="input input-bordered w-full bg-gray-700 text-white border-2 border-transparent mt-2" autocomplete="off" /></label>
                <button type="submit" class="btn w-full border-2 border-transparent mt-2">Generate Badge</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById("badgeForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const params = {};
            ["label", "message", "labelColor", "color", "style", "img", "url"].forEach(field => {
                const value = document.getElementById(field).value;
                if (value) params[field] = (field.includes("Color")) ? value.substring(1) : value;
            });
            const badgeUrl = `https://shiiruzu.vercel.app/badge?${new URLSearchParams(params)}`;
            document.getElementById("badgePreview").src = badgeUrl;
            document.getElementById("badgeLink").href = badgeUrl;
            document.getElementById("badgeLink").classList.remove("hidden");
            document.getElementById("badgeUrlText").textContent = badgeUrl;
            document.getElementById("badgeUrlText").classList.remove("hidden");
        });
    </script>
</body>
</html>
