<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
	<style>
		.container {
			border-radius: 8px; 
			background-image: linear-gradient(to right, {{fromColor}} 0%, {{viaColor}} 50%, {{toColor}} 100%);
			border: 0.8px solid {{borderColor}};  
			padding: 8px; 
			font-family: sans-serif; 
			width: 100%; 
			height: 100%; 
		}
		.icon {
			margin-right: 4px;
		}
		.point {
			padding-left: 6px;
			padding-right: 6px;
		}
		.header {
			display: flex;
			margin-bottom: 2px;
			line-height: 24px; 
			font-size: 16px;
			color: {{titleColor}};
			fill: {{titleColor}};
			grid-template-columns: 24px 344px; 
			align-items: center; 
			overflow: hidden;
      		height: 24px;
		}
		.title {
			overflow: hidden; 
			text-overflow: ellipsis; 
			white-space: nowrap; 
			word-break: break-all; 
			overflow-wrap: anywhere;
		}
    	.meta {
			display: flex;
			align-items: center;
			line-height: 17.5px; 
			font-size: 14px;
			color: {{textColor}};
			fill: {{textColor}};
			margin-right: 4px; 
			overflow: hidden;
      		height: 17.5px;
		}
	</style>

	<foreignObject x="0" y="0" width="400" height="120" class="container">
		<xhtml:div class="card">
			<xhtml:div class="header">
        		<svg viewBox="0 0 25 25" version="1.1" width="16px" height="16px" role="img" style="margin-right: 6px;"><ellipse cx="12.5" cy="5" fill="currentColor" fill-opacity="0.25" rx="7.5" ry="2"></ellipse><path d="M12.5 15C16.6421 15 20 14.1046 20 13V20C20 21.1046 16.6421 22 12.5 22C8.35786 22 5 21.1046 5 20V13C5 14.1046 8.35786 15 12.5 15Z" fill="currentColor" opacity="0.5"></path><path d="M12.5 7C16.6421 7 20 6.10457 20 5V11.5C20 12.6046 16.6421 13.5 12.5 13.5C8.35786 13.5 5 12.6046 5 11.5V5C5 6.10457 8.35786 7 12.5 7Z" fill="currentColor" opacity="0.5"></path><path d="M5.23628 12C5.08204 12.1598 5 12.8273 5 13C5 14.1046 8.35786 15 12.5 15C16.6421 15 20 14.1046 20 13C20 12.8273 19.918 12.1598 19.7637 12C18.9311 12.8626 15.9947 13.5 12.5 13.5C9.0053 13.5 6.06886 12.8626 5.23628 12Z" fill="currentColor"></path></svg>
				<xhtml:a class="title" href="{{url}}">{{id}}</xhtml:a>
			</xhtml:div>
			<xhtml:div class="meta">
				<xhtml:span class="text">Updated {{updatedAt}}</xhtml:span>
				<xhtml:span class="point">•</xhtml:span>
				<svg class="icon" viewBox="0 0 32 32" version="1.1" width="12px" height="14px" role="img"><path d="M26 24v4H6v-4H4v4a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2v-4zm0-10l-1.41-1.41L17 20.17V2h-2v18.17l-7.59-7.58L6 14l10 10l10-10z"></path></svg>
				<xhtml:span class="text">{{downloads}}</xhtml:span>
				<xhtml:span class="point">•</xhtml:span>
				<svg class="icon" viewBox="0 0 32 32" version="1.1" width="12px" height="14px" role="img"><path d="M22.45,6a5.47,5.47,0,0,1,3.91,1.64,5.7,5.7,0,0,1,0,8L16,26.13,5.64,15.64a5.7,5.7,0,0,1,0-8,5.48,5.48,0,0,1,7.82,0L16,10.24l2.53-2.58A5.44,5.44,0,0,1,22.45,6m0-2a7.47,7.47,0,0,0-5.34,2.24L16,7.36,14.89,6.24a7.49,7.49,0,0,0-10.68,0,7.72,7.72,0,0,0,0,10.82L16,29,27.79,17.06a7.72,7.72,0,0,0,0-10.82A7.49,7.49,0,0,0,22.45,4Z"></path></svg>
				<xhtml:span class="text">{{likes}}</xhtml:span>
			</xhtml:div>
		</xhtml:div>
	</foreignObject>
</svg>
